name: Tester l'APK dans un émulateur

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-test.yml'

permissions:
  contents: write

jobs:
  emulateur:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Page de test (joue le rôle du PC)
        run: |
          cd android/ci/site
          nohup python3 -m http.server 4243 --bind 0.0.0.0 > /tmp/site.log 2>&1 &
          sleep 1
          curl -s localhost:4243 | head -3
          # Un « PC » qui refuse les appareils non associés (accès téléphone désactivé) : réponse 403 en JSON.
          cat > /tmp/refuse.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(403)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"error":"Acces refuse"}')
          HTTPServer(('0.0.0.0', 4244), H).serve_forever()
          PY
          nohup python3 /tmp/refuse.py > /tmp/refuse.log 2>&1 &
          sleep 1
          curl -s -o /dev/null -w "403 test: %{http_code}\n" localhost:4244

      - name: Lancer l'émulateur et tester
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/ci/emulator-test.sh

      - name: Publier les captures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out || true
          gh release create "emu-${{ github.run_number }}" out/*.png out/logcat.txt out/ui-1.xml \
            --prerelease --latest=false \
            --title "Test émulateur ${{ github.run_number }}" --notes "Captures d'écran et journal du test."
