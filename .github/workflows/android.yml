name: Construire l'APK Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        working-directory: android
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Spotifree.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Spotifree-apk
          path: Spotifree.apk

      - name: Publier l'APK (lien de téléchargement stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Spotifree.apk \
            --title "Spotifree ${{ github.run_number }}" \
            --notes "APK Android de Spotifree (version 1.0.${{ github.run_number }})." \
            --latest
