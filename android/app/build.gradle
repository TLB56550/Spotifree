plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.spotifree.app'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.spotifree.app'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName System.getenv('APP_VERSION') ?: '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file('spotifree.keystore')
            storePassword 'spotifree'
            keyAlias 'spotifree'
            keyPassword 'spotifree'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
